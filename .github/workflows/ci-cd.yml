# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

# Se ejecuta en cada push a las ramas 'main' y 'develop'
on:
  push:
    branches:
      - main
      - develop

jobs:
  # Job para ejecutar los tests
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Run Maven tests
        run: mvn clean test

  # Job para construir y publicar la imagen Docker
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Se ejecuta solo si el job 'test' fue exitoso
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadatos simplificados para main y develop
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Etiqueta con el nombre de la rama (ej: develop)
            type=ref,event=branch
            # Etiqueta 'latest' solo para la rama main
            type=raw,value=latest,enable={{is_default_branch}}
            # Etiqueta semántica basada en el tag de git (ej: v1.0.3)
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
