# Configuracion de la aplicacion
spring.application.name=wallet-manager

# Configuracion del puerto
server.port=8085

# Configuracion de la base de datos
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracion de documentacion Swagger
springdoc.swagger-ui.path=/docs

# Configuracion de Logging
logging.level.org.springframework.web=DEBUG

# Configuracion de RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
rabbitmq.queue.name.check-money=checkMoney
rabbitmq.queue.name.confirm-checkout=checkCheckout
rabbitmq.queue.name.reject-checkout=rejectCheckout
rabbitmq.queue.name.make-order=makeOrder
rabbitmq.queue.name.reset-stock=resetStock

